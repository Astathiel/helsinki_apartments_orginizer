<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helsinki Apartment Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #fdfbf7 100%);
            --bg-color: #f0fdf4;
            --text-color: #14532d;
            --card-bg: #ffffff;
            --card-border: #bbf7d0;
            --input-bg: #f8fafc;
            --input-border: #86efac;
            --input-text: #14532d;
            --pill-bg: #dcfce7;
            --pill-border: #bbf7d0;
            --btn-primary: #16a34a;
            --btn-primary-hover: #15803d;
            --btn-edit: #86efac;
            --btn-edit-hover: #4ade80;
            --btn-edit-text: #064e3b;
            --btn-del: #fca5a5;
            --btn-del-hover: #f87171;
            --btn-del-text: #7f1d1d;
            --status-interested: #3b82f6; /* Keep some distinction, maybe forest blue/green */
            --status-applied: #10b981;
            --status-viewing: #fbbf24;
            --status-not: #94a3b8;
            --notes-bg: #f0fdfa;
            --notes-border: #14b8a6;
            --notes-text: #0f766e;
            --badge-spec-bg: #dcfce7;
            --badge-spec-text: #166534;
            --link-color: #059669;
            --link-hover: #047857;
            --border-color: #d1d5db;
            --msg-color: #64748b;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #022c22 0%, #064e3b 100%);
            --bg-color: #022c22;
            --text-color: #ecfdf5;
            --card-bg: #064e3b;
            --card-border: #065f46;
            --input-bg: #022c22;
            --input-border: #047857;
            --input-text: #ecfdf5;
            --pill-bg: #065f46;
            --pill-border: #047857;
            --btn-primary: #10b981;
            --btn-primary-hover: #059669;
            --btn-edit: #047857;
            --btn-edit-hover: #065f46;
            --btn-edit-text: #ecfdf5;
            --btn-del: #b91c1c;
            --btn-del-hover: #991b1b;
            --btn-del-text: #fecaca;
            --status-interested: #3b82f6;
            --status-applied: #34d399;
            --status-viewing: #fbbf24;
            --status-not: #64748b;
            --notes-bg: #064e3b;
            --notes-border: #10b981;
            --notes-text: #a7f3d0;
            --badge-spec-bg: #047857;
            --badge-spec-text: #d1fae5;
            --link-color: #34d399;
            --link-hover: #6ee7b7;
            --border-color: #065f46;
            --msg-color: #94a3b8;
        }

        body { font-family: 'Quicksand', system-ui, sans-serif; background: var(--bg-gradient); color: var(--text-color); margin: 0; padding: 20px; min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .user-pill { display: flex; align-items: center; gap: 8px; background: var(--pill-bg); padding: 6px 14px; border-radius: 20px; border: 1px solid var(--pill-border); color: var(--text-color); }
        .user-dot { width: 10px; height: 10px; border-radius: 50%; background: #10b981; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        h1, h2, h3 { margin-top: 0; }
        input, select, textarea, button { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--input-text); box-sizing: border-box; font-family: inherit; font-size: 1rem; transition: all 0.2s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--btn-primary); box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.2); }
        textarea { resize: vertical; min-height: 80px; }
        button { background: var(--btn-primary); color: white; border: none; font-weight: 600; cursor: pointer; border-radius: 10px; transition: background 0.2s, transform 0.1s; }
        button:hover { background: var(--btn-primary-hover); transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        .btn-row { display: flex; gap: 8px; }
        .btn-edit { background: var(--btn-edit); color: var(--btn-edit-text); padding: 8px 16px; margin: 0; width: auto; font-weight: 500; }
        .btn-edit:hover { background: var(--btn-edit-hover); }
        .btn-del { background: var(--btn-del); color: var(--btn-del-text); padding: 8px 16px; margin: 0; width: auto; font-weight: 500; }
        .btn-del:hover { background: var(--btn-del-hover); }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--card-bg); padding: 16px; border-radius: 16px; flex-wrap: wrap; gap: 10px; border: 1px solid var(--card-border); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .toolbar select { width: auto; margin: 0; padding: 8px 12px; }
        .apt-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 20px; border-bottom: 1px solid var(--border-color); gap: 16px; }
        .apt-row:last-child { border-bottom: none; }
        .badge { display: inline-block; padding: 6px 12px; border-radius: 8px; font-size: 0.9rem; margin-right: 8px; font-weight: 600; }
        .bg-spec { background: var(--badge-spec-bg); color: var(--badge-spec-text); }
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 700; margin-right: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
        .status-Interested { background: var(--status-interested); color: #ffffff; }
        .status-Applied { background: var(--status-applied); color: #ffffff; }
        .status-Viewing { background: var(--status-viewing); color: #000000; }
        .status-Not { background: var(--status-not); color: #ffffff; }
        .author-badge { display: inline-flex; align-items: center; gap: 5px; background: var(--card-bg); padding: 4px 10px; border-radius: 16px; font-size: 0.85rem; border: 1px solid var(--border-color); font-weight: 500; }
        .author-badge-leo { border-color: #38bdf8; color: #0ea5e9; }
        .author-badge-ella { border-color: #f472b6; color: #ec4899; }
        [data-theme="dark"] .author-badge-leo { color: #38bdf8; }
        [data-theme="dark"] .author-badge-ella { color: #f472b6; }
        .notes-box { font-size: 0.95rem; color: var(--notes-text); background: var(--notes-bg); padding: 12px; border-radius: 10px; margin-top: 12px; border-left: 4px solid var(--notes-border); line-height: 1.5; }
        .msg { font-size: 0.9rem; margin: 8px 0 0 0; min-height: 1.2em; color: var(--msg-color); font-weight: 500; }
        a { color: var(--link-color); text-decoration: none; font-weight: 700; transition: color 0.2s; }
        a:hover { color: var(--link-hover); text-decoration: underline; }
        #auth-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 50; }
        .auth-box { max-width: 400px; width: 100%; padding: 32px; text-align: center; }
        .auth-box h2 { color: var(--text-color); margin-bottom: 8px; }
    </style>
</head>
<body>
<div id="auth-overlay">
    <div class="card auth-box">
        <h2>Sign In</h2>
        <p style="color: #94a3b8; font-size: 0.9rem;">Sign in with your username & password</p>
        <input id="login-email" placeholder="Email (leo or ella)">
        <input id="login-pass" type="password" placeholder="Password">
        <button onclick="handleLogin()">Sign In</button>
        <p id="auth-msg" class="msg" style="color: #f87171;"></p>
    </div>
</div>

<div class="container">
    <div class="header-bar">
        <div>
            <h1 style="margin-bottom: 4px;">Helsinki Apartment Tracker</h1>
            <span id="sync-status" style="font-size: 0.85rem; color: #10b981; font-weight: 600;">⚡ Realtime Connected</span>
        </div>
        <div class="user-pill">
            <button id="theme-toggle" onclick="toggleTheme()" style="width: auto; background: transparent; border: none; color: var(--text-color); padding: 0 8px 0 0; margin: 0; cursor: pointer; font-size: 1.2rem; border-right: 1px solid var(--border-color);" aria-label="Toggle Theme">
                🌙
            </button>
            <div class="user-dot" style="margin-left: 8px;"></div>
            <span id="current-user-display" style="font-weight: 600; font-size: 0.95rem;">Logged In</span>
            <button onclick="handleLogout()" style="width: auto; background: transparent; border: none; color: var(--btn-del-hover); padding: 0 0 0 8px; margin: 0; cursor: pointer; font-size: 0.85rem;">Logout</button>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h3 id="form-title">Option A: Manual Entry / Edit</h3>
            <input id="m-url" placeholder="Apartment Link (https://...)">
            <input id="m-title" placeholder="Address / Title (e.g. Kiillekuja 3)">
            <input id="m-area" placeholder="asuinalue (e.g. Kruunuvuori, Pohjois-Pasila)">
            <input id="m-price" type="number" step="0.01" min="1" placeholder="Price (€ / kk)">
            <input id="m-size" type="number" step="0.1" min="1" placeholder="Size (m²)">
            <select id="m-status">
                <option value="Interested">Status: Interested</option>
                <option value="Applied">Status: Applied</option>
                <option value="Viewing Booked">Status: Viewing Booked</option>
                <option value="Not Interested">Status: Not Interested</option>
            </select>
            <textarea id="m-notes" placeholder="Notes (e.g. Sauna included, contact landlord)"></textarea>
            <button onclick="submitManual()">Save Apartment</button>
            <p id="m-status-msg" class="msg" style="color: #94a3b8;"></p>
        </div>
        <div class="card">
            <h3>Option B: Vuokraovi Auto-Scraper</h3>
            <input id="s-url" placeholder="Paste Vuokraovi Link (https://www.vuokraovi.com/kohde/...)">
            <input id="s-area" placeholder="Optional: Fallback asuinalue (e.g. Kruunuvuori)">
            <button onclick="submitScrape()">Auto-Fetch & Save</button>
            <p id="s-status" class="msg" style="color: #94a3b8;"></p>
        </div>
    </div>

    <div class="toolbar">
        <div>
            <span>Sort inside each asuinalue by:</span>
            <select id="sort-select" onchange="loadApartments()">
                <option value="price-false">Price: Low to High (€/kk)</option>
                <option value="price-true">Price: High to Low (€/kk)</option>
                <option value="size_m2-true">Size: Largest First (m²)</option>
                <option value="size_m2-false">Size: Smallest First (m²)</option>
                <option value="eur_per_m2-false">Best Value: Lowest €/m²</option>
            </select>
        </div>
    </div>

    <div id="groups"></div>
</div>

<script>
// Replace these two strings with your actual Supabase credentials:
const SUPABASE_PROJECT_URL = "https://fyrwiytzuxsebluygtjb.supabase.co";
const SUPABASE_ANON_PUBLIC_KEY = "sb_publishable_EyvpHQRMoLrGmstxquNbfw_txuKKrex";

const sb = supabase.createClient(SUPABASE_PROJECT_URL, SUPABASE_ANON_PUBLIC_KEY);
let currentSession = null;

// Theme Toggle Logic
function initTheme() {
    const savedTheme = localStorage.getItem('theme') || 'light';
    if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('theme-toggle').textContent = '☀️';
    }
}

function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    document.getElementById('theme-toggle').textContent = newTheme === 'dark' ? '☀️' : '🌙';
}

initTheme();

async function apiHeaders() {
    const { data: { session } } = await sb.auth.getSession();
    const token = session ? session.access_token : (currentSession ? currentSession.access_token : "");
    return {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
    };
}

async function handleLogin() {
    const rawInput = document.getElementById("login-email").value.trim().toLowerCase();
    const password = document.getElementById("login-pass").value;
    const msg = document.getElementById("auth-msg");
    msg.textContent = "";

    if (!rawInput || !password) {
        msg.textContent = "Please enter both username/email and password.";
        return;
    }

    // Automatically append domain if you typed a plain username like "leo" or "ella"
    const email = rawInput.includes("@") ? rawInput : `${rawInput}@tracker.local`;

    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
        msg.textContent = error.message;
        return;
    }

    currentSession = data.session;
    document.getElementById("auth-overlay").style.display = "none";
    updateUserDisplay(data.user);
    setupRealtime();
    await loadApartments();
}

async function handleLogout() {
    await sb.auth.signOut();
    location.reload();
}

function updateUserDisplay(user) {
    if (!user) return;
    const name = user.user_metadata?.display_name || user.email.split("@")[0].toUpperCase();
    document.getElementById("current-user-display").textContent = name;
}

function setupRealtime() {
    sb.channel("public:apartments")
      .on("postgres_changes", { event: "*", schema: "public", table: "apartments" }, () => {
          loadApartments();
      })
      .subscribe((status) => {
          const el = document.getElementById("sync-status");
          if (status === "SUBSCRIBED") {
              el.textContent = "Realtime Connected";
              el.style.color = "#10b981";
          }
      });
}

async function loadApartments() {
    const headers = await apiHeaders();
    const [sortBy, desc] = document.getElementById("sort-select").value.split("-");
    const res = await fetch(`/api/apartments?sort_by=${sortBy}&desc=${desc}`, { headers });
    if (res.status === 401) {
        document.getElementById("auth-overlay").style.display = "flex";
        return;
    }
    const data = await res.json();
    const container = document.getElementById("groups");
    container.innerHTML = "";
    for (const [area, items] of Object.entries(data)) {
        const card = document.createElement("div");
        card.className = "card";
        card.style.marginBottom = "16px";
        const rows = items.map(apt => {
            const statusClass = apt.status.startsWith("Applied") ? "status-Applied" : apt.status.startsWith("Viewing") ? "status-Viewing" : apt.status.startsWith("Not") ? "status-Not" : "status-Interested";
            const notesHtml = apt.notes ? `<div class="notes-box">📝 ${escapeHtml(apt.notes)}</div>` : "";
            const author = apt.added_by || "Leo";
            const authorClass = author.toLowerCase() === "ella" ? "author-badge-ella" : "author-badge-leo";
            const safeAptJson = encodeURIComponent(JSON.stringify(apt));
            return `
                <div class="apt-row">
                    <div style="flex: 1;">
                        <div style="margin-bottom: 6px;">
                            <span class="status-badge ${statusClass}">${apt.status}</span>
                            <span class="author-badge ${authorClass}">Added by ${author}</span>
                        </div>
                        <a href="${apt.url}" target="_blank" style="font-size: 1.1rem;">${escapeHtml(apt.title)}</a>
                        <div style="margin-top: 8px;">
                            <span class="badge bg-spec">${apt.price} €/kk</span>
                            <span class="badge bg-spec">${apt.size_m2} m²</span>
                            <span class="badge bg-spec">${apt.eur_per_m2} €/m²</span>
                        </div>
                        ${notesHtml}
                    </div>
                    <div class="btn-row">
                        <button class="btn-edit" onclick="editApt('${safeAptJson}')">Edit</button>
                        <button class="btn-del" onclick="deleteApt(${apt.id})">Delete</button>
                    </div>
                </div>
            `;
        }).join("");
        card.innerHTML = `<h2>${area} (${items.length})</h2>${rows}`;
        container.appendChild(card);
    }
}

function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function editApt(encodedJson) {
    const apt = JSON.parse(decodeURIComponent(encodedJson));
    document.getElementById("m-url").value = apt.url;
    document.getElementById("m-title").value = apt.title;
    document.getElementById("m-area").value = apt.asuinalue;
    document.getElementById("m-price").value = apt.price;
    document.getElementById("m-size").value = apt.size_m2;
    document.getElementById("m-status").value = apt.status || "Interested";
    document.getElementById("m-notes").value = apt.notes || "";
    document.getElementById("form-title").textContent = `Option A: Editing Listing (By ${apt.added_by || 'Leo'})`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function submitManual() {
    const status = document.getElementById("m-status-msg");
    const url = document.getElementById("m-url").value.trim();
    const title = document.getElementById("m-title").value.trim();
    const asuinalue = document.getElementById("m-area").value.trim();
    const price = parseFloat(document.getElementById("m-price").value);
    const size_m2 = parseFloat(document.getElementById("m-size").value);
    const aptStatus = document.getElementById("m-status").value;
    const notes = document.getElementById("m-notes").value.trim();
    if (!url || !title || !asuinalue || isNaN(price) || price <= 0 || isNaN(size_m2) || size_m2 <= 0) {
        status.style.color = "#f87171";
        status.textContent = "All fields are required and Price / Size must be greater than 0.";
        return;
    }
    const headers = await apiHeaders();
    const res = await fetch("/api/apartments/manual", {
        method: "POST",
        headers,
        body: JSON.stringify({ url, title, asuinalue, price, size_m2, status: aptStatus, notes })
    });
    const data = await res.json();
    if (!res.ok) {
        status.style.color = "#f87171";
        status.textContent = data.detail?.[0]?.msg || data.detail || "Invalid input.";
        return;
    }
    status.style.color = "#4ade80";
    status.textContent = "Saved to board!";
    ["m-url", "m-title", "m-area", "m-price", "m-size", "m-notes"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("m-status").value = "Interested";
    document.getElementById("form-title").textContent = "Option A: Manual Entry / Edit";
    loadApartments();
}

async function submitScrape() {
    const status = document.getElementById("s-status");
    const url = document.getElementById("s-url").value.trim();
    const fallback_asuinalue = document.getElementById("s-area").value.trim();
    if (!url) {
        status.style.color = "#f87171";
        status.textContent = "Please paste a Vuokraovi link first.";
        return;
    }
    status.style.color = "#94a3b8";
    status.textContent = "Fetching listing from Vuokraovi...";
    const headers = await apiHeaders();
    const res = await fetch("/api/apartments/scrape", {
        method: "POST",
        headers,
        body: JSON.stringify({ url, fallback_asuinalue })
    });
    const data = await res.json();
    if (!res.ok) {
        status.style.color = "#f87171";
        status.textContent = data.detail?.[0]?.msg || data.detail || "Scrape failed—use Option A.";
        return;
    }
    status.style.color = "#4ade80";
    status.textContent = `Saved to ${data.asuinalue}!`;
    document.getElementById("s-url").value = "";
    document.getElementById("s-area").value = "";
    loadApartments();
}

async function deleteApt(id) {
    const headers = await apiHeaders();
    await fetch(`/api/apartments/${id}`, { method: "DELETE", headers });
    loadApartments();
}

// Auto-check session on load
sb.auth.getSession().then(({ data: { session } }) => {
    if (session) {
        document.getElementById("auth-overlay").style.display = "none";
        updateUserDisplay(session.user);
        setupRealtime();
        loadApartments();
    } else {
        document.getElementById("auth-overlay").style.display = "flex";
    }
});
</script>
</body>
</html>
